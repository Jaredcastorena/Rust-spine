name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: bash scripts/check-release-hygiene.sh
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install --features cli cargo-about --version 0.9.2 --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
      - run: bash scripts/check-third-party-licenses.sh
      - run: cargo fmt -p spine-cli -p spine-heart -p spine-models -p spine-runtime -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --workspace --locked
      - run: target/release/spine --version

  desktop-platforms:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Desktop tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-tests-${{ matrix.os }}
      # AArch64 gemm-f16 requires optimization; match the release test profile.
      - run: cargo test --release --workspace --locked
