name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bash scripts/check-release-hygiene.sh
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install --features cli cargo-about --version 0.9.2 --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
      - run: bash scripts/check-third-party-licenses.sh
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --workspace --locked
      - run: target/release/spine --version
