name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bash scripts/check-release-hygiene.sh
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install --features cli cargo-about --version 0.9.2 --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
      - run: bash scripts/check-third-party-licenses.sh
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --workspace --locked
      - run: target/release/spine --version
