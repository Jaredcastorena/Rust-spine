<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spine</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside><div class="brand"><span class="mark">S</span><div><strong>Spine</strong><small>local partner</small></div></div>
    <section id="heart"></section><section><h3>Tools</h3><div id="tools"></div></section>
    <div class="controls"><button data-action="stop">Stop safely</button><button data-action="interrupt">Interrupt</button><button data-action="resume">Resume</button><button data-action="tasks">Tasks</button><button data-action="quit">Quit server</button></div>
  </aside>
  <main><header><div><strong id="phase">Ready</strong><span id="activity"></span></div><span id="count"></span></header>
    <div id="messages"><div class="empty"><span class="mark large">S</span><h1>What are we working on?</h1><p>The same heart, tools, memory, and controls—through the browser.</p></div></div>
    <div id="notice"></div>
    <form id="composer"><textarea id="input" rows="1" placeholder="Message Spine"></textarea><button id="send" type="submit">Send</button></form>
  </main>
  <script src="/app.js"></script>
</body></html>
