[workspace]
resolver = "3"
members = [
    "crates/spine-heart",
    "crates/spine-cli",
    "crates/spine-runtime",
    "crates/spine-models",
]
exclude = ["fuzz", "vendor/candle-core"]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
bip39 = { version = "3.0.0", features = ["rand", "zeroize"] }
blake3 = "1.8.7"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
getrandom = "0.4.3"
glob = "0.3.4"
hex = "0.4.3"
hkdf = "0.13.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
redb = "4.4.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokenizers = "0.23.2"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "signal", "time"] }
walkdir = "2.5.0"
zeroize = { version = "1.9.1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Temporary, auditable ZIP 9 compatibility backport; see vendor/README.md.
[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
