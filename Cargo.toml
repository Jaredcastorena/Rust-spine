[workspace]
resolver = "3"
members = [
    "crates/spine-heart",
    "crates/spine-cli",
    "crates/spine-runtime",
    "crates/spine-models",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8"
bip39 = { version = "2.2.2", features = ["rand", "zeroize"] }
blake3 = "1.8.2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
getrandom = "0.4.0"
glob = "0.3.3"
hex = "0.4.3"
hkdf = "0.13.0"
postcard = { version = "1.1.3", features = ["alloc"] }
redb = "4.2.0"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0-rc.2"
thiserror = "2.0.17"
tempfile = "3.23.0"
tokenizers = "0.22.2"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "signal", "time"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }
walkdir = "2.5.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
